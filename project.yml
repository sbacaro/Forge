name: Forge

options:
  bundleIdPrefix: com.forgeapp
  deploymentTarget:
    macOS: "27.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.2"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: ""

targets:
  Forge:
    type: application
    platform: macOS
    sources:
      - path: Forge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forgeapp.forge
        PRODUCT_NAME: Forge
        INFOPLIST_KEY_CFBundleDisplayName: Forge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon.icon
        MARKETING_VERSION: "1.0.0"
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
    dependencies:
      - target: ForgeKit
        embed: false
  ForgeKit:
    type: framework
    platform: macOS
    sources:
      - path: Forge/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forgeapp.forgekit
        PRODUCT_NAME: ForgeKit
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
  ForgeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ForgeTests
    dependencies:
      - target: ForgeKit
      - target: Forge

schemes:
  Forge:
    build:
      targets:
        Forge: all
        ForgeKit: all
        ForgeTests: [test]
    test:
      targets:
        - ForgeTests
